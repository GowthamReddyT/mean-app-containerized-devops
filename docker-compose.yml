version: "3.8"

services:

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    image: gowtham755/mean-backend
    container_name: backend
    restart: always
    environment:
      - DB_HOST=mongodb
    depends_on:
      - mongodb

  frontend:
    image: gowtham755/mean-frontend
    container_name: frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
