services:

  mongo:
    image: mongo
    container_name: mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    image: gowtham755/mean-backend
    container_name: backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/tasks
    depends_on:
      - mongo
    ports:
      - "5000:8080"

  frontend:
    image: gowtham755/mean-frontend
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
